name: Publish Extension

# Publishes the VS Code extension. Decoupled from the CLI's release.yml (which
# triggers on `v*` tags) so the extension versions independently:
#   1. bump `version` in extension/package.json
#   2. tag the commit `ext-v<version>` (e.g. ext-v0.1.0) and push the tag
# A manual run (workflow_dispatch) only builds + packages the .vsix as an
# artifact — it never publishes.
#
# Required repository secrets:
#   VSCE_PAT   - Azure DevOps PAT with "Marketplace > Manage" scope (required)
#   OVSX_TOKEN - open-vsx.org access token (optional; Open VSX step is skipped if unset)

on:
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#ext-v}"
          PKG="$(node -p "require('./extension/package.json').version")"
          echo "tag=$TAG manifest=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension version $PKG — bump extension/package.json"
            exit 1
          fi

      - name: Typecheck extension
        run: npm run typecheck:ext

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build:ext

      - name: Package VSIX
        working-directory: extension
        run: npx --no-install vsce package --no-dependencies -o prless-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: prless-vscode-vsix
          path: extension/prless-vscode.vsix

      - name: Publish to VS Code Marketplace
        if: ${{ github.event_name == 'push' }}
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath prless-vscode.vsix

      - name: Publish to Open VSX
        if: ${{ github.event_name == 'push' && env.OVSX_TOKEN != '' }}
        working-directory: extension
        run: npx --no-install ovsx publish prless-vscode.vsix -p "$OVSX_TOKEN"
